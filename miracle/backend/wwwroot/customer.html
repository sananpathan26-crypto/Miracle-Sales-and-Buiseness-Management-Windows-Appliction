<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        h2 {
            text-align: center;
            color: #1a1a40;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            width: 100%;
            background: rgb(26, 26, 64);
            color: #facc15;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

            button:hover {
                background: rgb(40, 40, 90);
            }

        .product-info {
            background: #f0f2f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .back-arrow {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            text-decoration: none;
            color: rgb(26, 26, 64);
            font-weight: bold;
        }

            .back-arrow:hover {
                color: rgb(40, 40, 90);
            }
    </style>
</head>

<body>

    <div class="container">
        <h2>Place Your Order</h2>

        <div class="product-info">
            <p><strong>Product:</strong> <span id="productName"></span></p>
            <p><strong>Price:</strong> <span id="productPrice"></span></p>
        </div>

        <!-- Back button -->
        <a href="product.html" class="back-arrow">&#8592;</a>

        <form id="orderForm">
            <label for="custName">Full Name</label>
            <input type="text" id="custName" required>

            <label for="custMobile">Mobile Number</label>
            <input type="tel" id="custMobile" required>

            <label for="custEmail">Email</label>
            <input type="email" id="custEmail">

            <label for="custAddress">Address</label>
            <textarea id="custAddress" rows="4" required></textarea>

            <label for="paymentMode">Mode of Transaction</label>
            <select id="paymentMode" required>
                <option value="">Select</option>
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>
            </select>

            <button type="submit">Place Order</button>
        </form>
    </div>

    <script>
        const API = "https://localhost:7267";
        const params = new URLSearchParams(window.location.search);
        const productName = params.get("name");
        const productPrice = params.get("price");

        document.getElementById("productName").innerText = productName;
        document.getElementById("productPrice").innerText = productPrice;

        document.getElementById("orderForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const orderData = {
                customerName: document.getElementById("custName").value,
                mobile: document.getElementById("custMobile").value,
                email: document.getElementById("custEmail").value,
                address: document.getElementById("custAddress").value,
                productName: productName,
                price: Number(productPrice),
                paymentMode: document.getElementById("paymentMode").value
            };

            fetch(`${$API}/api/orders/place`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(orderData)
            })
                .then(res => {
                    if (!res.ok) throw new Error("Request failed");
                    return res.json();
                })
                .then(data => {
                    if (data.status === "success") {
                        window.location.href = "order-confirmed.html";
                    } else {
                        alert("Order failed");
                    }
                })
                .catch(err => {
                    alert("Backend not reachable");
                    console.error(err);
                });

        });
    </script>



</body>
</html>
