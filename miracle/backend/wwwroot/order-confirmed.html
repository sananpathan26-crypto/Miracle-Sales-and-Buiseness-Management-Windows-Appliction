<!DOCTYPE html>
<html>
<head>
    <title>Order Confirmed</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 400px;
        }

        h2 {
            color: green;
        }

        /* Arrow style */
        .back-arrow {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            text-decoration: none;
            color: #1a1a40;
            font-weight: bold;
        }

            .back-arrow:hover {
                color: #facc15;
            }
    </style>
</head>
<body>

    <!-- Back Arrow -->
    <a href="index.html" class="back-arrow">←</a>

    <div class="box">
        <h2>✅ Order Confirmed</h2>
        <p>Thank you for your order.</p>
        <p>Your order will be delivered soon </p>
    </div>

</body>
</html>
