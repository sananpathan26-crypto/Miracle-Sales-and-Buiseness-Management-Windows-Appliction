<!DOCTYPE html>
<html>
<head>
    <title>Online Orders</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
        }
        .header {
            background: rgb(26,26,64);
            color: white;
            padding: 15px 25px;
            font-size: 22px;
            font-weight: bold;
        }
        .new-order {
            background-color: #fff3cd !important;
        }
    </style>
</head>
<body>

<div class="header">Online Orders</div>

<div class="container mt-4">
    <button class="btn btn-primary mb-3" onclick="markSeen()">Mark All Seen</button>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Mobile</th>
                <th>Product</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Payment</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
    </table>
</div>

<script>
const API = "/api/orders";

function loadOrders() {
    fetch(`${API}/all`)
        .then(res => res.json())
        .then(data => {
            const body = document.getElementById("ordersBody");
            body.innerHTML = "";

            data.forEach(o => {
                const row = document.createElement("tr");
                if (o.IsSeen === 0) row.classList.add("new-order");

                row.innerHTML = `
                    <td>${o.OrderID}</td>
                    <td>${o.CustomerName}</td>
                    <td>${o.Mobile}</td>
                    <td>${o.ProductName}</td>
                    <td>${o.Quantity}</td>
                    <td>₹${o.Price}</td>
                    <td>${o.PaymentMode}</td>
                    <td>${new Date(o.OrderDate).toLocaleString()}</td>
                `;
                body.appendChild(row);
            });
        });
}

function markSeen() {
    fetch(`${API}/markasseen`, { method: "POST" })
        .then(loadOrders);
}

loadOrders();
</script>



</body>
</html>
