<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Top 5 Highly Selling Products</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
        }

        .dashboard-title {
            font-weight: 700;
            color: #1e1e5f;
        }

        .top-product-card {
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #1e1e5f, #3434a4);
            color: white;
            padding: 20px;
            transition: all 0.3s ease;
            height: 100%;
        }

            .top-product-card:hover {
                transform: translateY(-8px);
                box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            }

        .rank-badge {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: gold;
            color: black;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
        }

        .stat {
            font-size: 14px;
            margin-top: 6px;
            opacity: 0.95;
        }

        .revenue {
            color: #7CFF7C;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container mt-4">
        <h3 class="dashboard-title mb-4">
            🔥 Top 5 Highly Selling Products
        </h3>

        <div class="row" id="topProducts">
            <!-- Cards injected here -->
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {

        fetch("/api/highsell/top-5-products")
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("topProducts");
                container.innerHTML = "";

                if (!data || data.length === 0) {
                    container.innerHTML = "<p>No sales data available</p>";
                    return;
                }

                data.forEach((item, index) => {
                    container.innerHTML += `
                        <div class="col-lg-4 col-md-6 mb-4">
                            <div class="top-product-card">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="rank-badge">${index + 1}</div>
                                    <i class="fa-solid fa-fire fa-lg text-warning"></i>
                                </div>

                                <div class="product-name">
                                    ${item.productName}
                                </div>

                                <div class="stat">
                                    📦 Quantity Sold: <b>${item.totalSold}</b>
                                </div>

                                <div class="stat revenue">
                                    💰 Revenue: ₹${item.totalRevenue}
                                </div>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => {
                document.getElementById("topProducts").innerHTML =
                    "<p class='text-danger'>Failed to load data</p>";
                console.error(err);
            });
    });
    </script>

</body>
</html>
