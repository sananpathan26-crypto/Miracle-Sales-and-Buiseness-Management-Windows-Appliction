    <script>
        let rawData = [];

        fetch("http://localhost:5271/api/online-customers/with-orders")
            .then(res => res.json())
            .then(data => {
                rawData = data;
                renderGrouped(data);
            });

        function renderGrouped(data) {

            // 🔹 Group by Mobile (unique customer)
            const grouped = {};

            data.forEach(o => {
                if (!grouped[o.mobile]) {
                    grouped[o.mobile] = {
                        customerName: o.customerName,
                        mobile: o.mobile,
                        orders: []
                    };
                }
                grouped[o.mobile].orders.push(o);
            });

            let html = "";

            Object.values(grouped).forEach(c => {

                html += `
                <div class="card p-3 mb-3">
                    <h5>${c.customerName}</h5>
                    <div>📞 ${c.mobile}</div>
                    <hr>
            `;

                c.orders.forEach(o => {
                    html += `
                    <div style="margin-left:15px;">
                        📦 ${o.productName}<br>
                        Qty: ${o.quantity} | ₹${o.price}<br>
                        <small class="text-muted">
                            ${new Date(o.orderDate).toLocaleString()}
                        </small>
                        <hr>
                    </div>

                    

                `;
                });

                html += `</div>`;
            });

            document.getElementById("customerList").innerHTML = html;
        }

        // 🔍 SEARCH (still works!)
        document.getElementById("searchInput").addEventListener("input", function () {
            const term = this.value.toLowerCase();

            const filtered = rawData.filter(x =>
                x.customerName.toLowerCase().includes(term) ||
                x.mobile.toLowerCase().includes(term) ||
                x.productName.toLowerCase().includes(term)
            );

            renderGrouped(filtered);
        });
    </script>


</body>
