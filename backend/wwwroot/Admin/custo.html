<body>

    <div class="header">Online Orders</div>

        <button class="btn btn-primary mb-3" onclick="markSeen()">Mark All Seen</button>

        <table class="table table-bordered table-hover">

                <tr>
                    <th>ID</th>

                    <th>Mobile</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
        </table>
    </div>

        function loadOrders() {
            fetch("/online-orders/all")
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById("ordersBody");
                    tbody.innerHTML = "";

                    data.forEach(o => {
                        const tr = document.createElement("tr");

                        tr.innerHTML = `
                        <td>${o.id}</td>
                        <td>${o.customer}</td>
                        <td>${o.mobile}</td>
                        <td>${o.product}</td>
                        <td>${o.qty}</td>
                        <td>₹${o.price}</td>
                        <td>${o.payment}</td>
                        <td>
            <select class="form-select form-select-sm"
                    onchange="updateStatus(${o.id}, this.value)">
                <option ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                <option ${o.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                <option ${o.status === 'Packed' ? 'selected' : ''}>Packed</option>
                <option ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                <option ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
            </select>
        </td>
                        <td>${new Date(o.date).toLocaleString()}</td>
                    `;

                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error("Error loading orders", err);
                });
        }
        
            function updateStatus(orderId, status) {
                fetch("/online-orders/update-status", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        orderId: orderId,
                        status: status
                    })
                })
                    .catch(err => console.error("Status update failed", err));
}
    


    function markSeen() {
    fetch(`/online-orders/markasseen`, { method: "POST" })
    .then(() => loadOrders());
    }

    loadOrders();
    </script>

</body>
