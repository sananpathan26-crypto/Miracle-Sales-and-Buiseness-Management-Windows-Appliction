<!DOCTYPE html>
<html>
<head>
    <title>Online Orders</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
        }

        .header {
            background: rgb(26,26,64);
            color: white;
            padding: 15px 25px;
            font-size: 22px;
            font-weight: bold;
        }

        .new-order {
            background-color: #fff3cd !important;
        }
    </style>
</head>
<body>

    <div class="header">Online Orders</div>

    <div class="container mt-4">
        <button class="btn btn-primary mb-3" onclick="markSeen()">Mark All Seen</button>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Mobile</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
        </table>
    </div>

    
    <script>
        function loadOrders() {
            fetch("/api/online-orders/all")
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById("ordersBody");
                    tbody.innerHTML = "";

                    data.forEach(o => {
                        const tr = document.createElement("tr");

                        if (o.isSeen == 1) tr.classList.add("new-order");
                        const status = o.status || "Pending";


                        tr.innerHTML = `
                        <td>${o.orderId}</td>
                        <td>${o.customerName}</td>
                        <td>${o.mobile}</td>
                        <td>${o.productName}</td>
                        <td>${o.quantity}</td>
                        <td>₹${o.price}</td>
                        <td>${o.paymentMode}</td>

                        <td>
                            
                            <select class="form-select form-select-sm"
                                            data-id="${o.orderId}"
                                          onchange="updateStatus(this)">

                                <option value="Pending"   ${status === 'Pending' ? 'selected' : ''}>Pending</option>
                               <option value="Confirmed" ${status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                               <option value="Packed"    ${status === 'Packed' ? 'selected' : ''}>Packed</option>
                               <option value="Shipped"   ${status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                               <option value="Delivered" ${status === 'Delivered' ? 'selected' : ''}>Delivered</option>

                            </select>
                        </td>

                        <td>${new Date(o.orderDate).toLocaleString()}</td>
                    `;

                        tbody.appendChild(tr);
                    });
                })
                .catch(err => console.error("Error loading orders", err));
        }
    


        //function updateStatus(orderId, status) {
        //    fetch("/api/online-orders/update-status", {
        //        method: "POST",
        //        headers: { "Content-Type": "application/json" },
        //        body: JSON.stringify({ orderId, status })
        //    })
        //        .then(() => console.log("Status updated"))

        //        .catch(err => console.error(err));
        //}

        function updateStatus(select) {
            const orderId = select.dataset.id;
            const status = select.value;

            fetch("/api/online-orders/update-status", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ orderId, status })
            })
                .catch(err => console.error(err));
        }




    function markSeen() {
        fetch(`api/online-orders/markseen`, { method: "POST" })
    .then(() => loadOrders());
    }

    loadOrders();
    </script>

</body>
</html>
