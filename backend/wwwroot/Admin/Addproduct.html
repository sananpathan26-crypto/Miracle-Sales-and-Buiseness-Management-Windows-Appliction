<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
</head>
<body>

    <h2>Add Product</h2>

    <form id="productForm">
        <input type="text" id="name" placeholder="Product Name" required><br><br>
        <textarea id="desc" placeholder="Description"></textarea><br><br>
        <input type="number" id="price" placeholder="Price" step="0.01"><br><br>
        <input type="text" id="category" placeholder="Category"><br><br>
        <input type="text" id="brand" placeholder="Brand"><br><br>
        <input type="text" id="image" placeholder="Image Path"><br><br>

        <button type="submit">Add Product</button>
    </form>

    <script>
document.getElementById("productForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const product = {
        productName: document.getElementById("name").value,
        description: document.getElementById("desc").value,
        price: parseFloat(document.getElementById("price").value),
        category: document.getElementById("category").value,
        brand: document.getElementById("brand").value,
        imagePath: document.getElementById("image").value
    };

    const response = await fetch("http://localhost:5271/api/products", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(product)
    });

    if (response.ok) {
        alert("Product Added Successfully");
        document.getElementById("productForm").reset();
    } else {
        alert("Error adding product");
    }
});
    </script>

</body>
</html>
