<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <meta charset="utf-8">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #f4f6fb;
        }

        /* HEADER */
        .header {
            background: rgb(26,26,64);
            color: white;
            padding: 15px 25px;
            font-size: 22px;
            font-weight: bold;
        }

        /* LAYOUT */
        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #ffffff;
            border-right: 1px solid #ddd;
        }

        .menu-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-weight: 600;
        }

        .menu-item:hover {
            background: #f0f2ff;
        }

        .menu-item.active {
            background: rgb(26,26,64);
            color: white;
        }

        /* CONTENT */
        .content {
            flex: 1;
            background: #f4f6fb;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
    </style>
</head>
<body>

<div class="header">Admin Dashboard</div>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="menu-item active" onclick="loadPage(this,'orders.html')">
            🛒 Online Orders
        </div>
        <div class="menu-item" onclick="loadPage(this,'online_customer.html')">
            👤 Customers
        </div>
        <div class="menu-item" onclick="loadPage(this,'sales.html')">
            📊 Sales
        </div>
        <div class="menu-item" onclick="loadPage(this,'highsell.html')">
            🔥 Top Selling Products
        </div>
        <div class="menu-item" onclick="loadPage(this,'Addproduct.html')">
            + Add New Product
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <iframe id="contentFrame" src="orders.html"></iframe>
    </div>

</div>

<script>
    function loadPage(el, page) {
        document.querySelectorAll('.menu-item')
            .forEach(m => m.classList.remove('active'));

        el.classList.add('active');
        document.getElementById('contentFrame').src = page;
    }
</script>

</body>
</html>
