    <script>
        document.querySelector(".add-cart-btn").addEventListener("click", function () {

            // ✅ Get string productId (NO parseInt)
            const params = new URLSearchParams(window.location.search);
            const productId = params.get("id");

            if (!productId) {
                alert("Invalid product");
                return;
            }

            // ✅ Clean price (remove ₹ and commas)
            let priceText = document.getElementById("productPrice").innerText;
            let cleanPrice = priceText.replace(/[₹,]/g, "");
            let numericPrice = parseFloat(cleanPrice);

            const productData = {
                productId: productId,  // string
                productName: document.getElementById("productName").innerText,
                price: numericPrice,   // number
                imageUrl: document.getElementById("productImage").src
            };

            fetch("/api/cart/add", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify(productData)
            })
                .then(res => {
                    if (res.status === 401) {
                        alert("Please login first");
                        return;
                    }
                    if (!res.ok) {
                        alert("Failed to add item");
                        return;
                    }
                    alert("Added to cart!");
                })
                .catch(err => {
                    console.error(err);
                    alert("Something went wrong");
                });
        });
    </script>

    <script>
        function openCart() {
            window.location.href = "cart.html";
        }


        async function updateCartBadge() {
            try {
                const res = await fetch("/api/cart/mycart", {
                    credentials: "include"
                });

                if (!res.ok) return;

                const data = await res.json();

                let totalQty = 0;

                data.forEach(item => {
                    totalQty += item.quantity;
                });

                const badge = document.getElementById("cart-count");

                if (badge) {
                    badge.innerText = totalQty;
                    badge.style.display = totalQty > 0 ? "flex" : "none";
                }

            } catch (err) {
                console.error("Cart badge error", err);
            }
        }

        // Run on every page load
        document.addEventListener("DOMContentLoaded", () => {
            updateCartBadge();
        });
    </script>
