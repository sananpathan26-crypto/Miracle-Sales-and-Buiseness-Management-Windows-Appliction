<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
        }

        /* Form Styling */
        .form-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.025em;
        }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                font-size: 14px;
                font-weight: 500;
                margin-bottom: 6px;
                color: var(--text-muted);
            }

            .form-group input,
            .form-group textarea,
            .form-group select {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid var(--border);
                border-radius: 10px;
                font-size: 15px;
                transition: all 0.2s;
                box-sizing: border-box;
                background: #fff;
            }

                .form-group input:focus,
                .form-group textarea:focus {
                    outline: none;
                    border-color: var(--primary);
                    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
                }

        /* Summary Styling */
        .summary {
            background: #111827;
            color: white;
            padding: 30px;
            border-radius: 16px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

            .summary h3 {
                font-size: 20px;
                margin-top: 0;
                padding-bottom: 15px;
                border-bottom: 1px solid #374151;
            }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #374151;
        }

        .item-info span {
            display: block;
        }

        .item-name {
            font-weight: 500;
            font-size: 15px;
        }

        .item-qty {
            color: #9ca3af;
            font-size: 13px;
        }

        .total-section {
            margin-top: 20px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        .total {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #374151;
        }

        /* Button Styling */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            margin-top: 10px;
        }

            .btn-submit:hover {
                background: var(--primary-hover);
                transform: translateY(-1px);
            }

            .btn-submit:active {
                transform: translateY(0);
            }

        /* Responsive */
        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
            }

            body {
                padding: 10px;
            }

            .summary {
                order: -1;
            }
            /* Show summary first on mobile */
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <span class="mir">MIR</span><span class="a">A</span><span class="cle">CLE</span>
        </div>

        <ul class="nav-links">
            <a href="index.html">Home</a>
            <li><a href="#categories">Shop Now</a></li>
            <li><a href="services.html">Our Services</a></li>
            <li><a href="aboutus.html">About Us</a></li>
        </ul>

        <div class="nav-icons">
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search cameras...">
                <i class="fas fa-search" id="search-icon"></i>
            </div>

            <div class="cart-icon" onclick="openCart()">
                <i class="fas fa-shopping-cart" title="Cart"></i>
                <span id="cart-count">0</span>
            </div>

            <!--
                <i class="fas fa-user" title="Profile"></i> -->
            <!--
            just for profile -->

            <div class="profile-wrapper">
                <i class="fas fa-user" id="profile-btn" title="Profile"></i>

                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="profile-header">
                        <i class="fas fa-user-circle"></i>
                        <div>
                            <h4>Guest User</h4>
                            <p>guest@email.com</p>
                        </div>
                    </div>

                    <ul class="profile-menu">
                        <li><a href="profile.html">My Account</a></li>
                        <li><a href="MyOrders.html">Orders</a></li>
                        <li><a href="#">Settings</a></li>
                        <li class="logout"><a href="#">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Back Arrow -->
    <a href="index.html" class="back-arrow">←</a>


    <div class="container">
        <div class="form-box">
            <h2>Billing Details</h2>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="text" id="mobile" placeholder="+91 00000 00000" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com">
                </div>
            </div>

            <div class="form-group">
                <label>Shipping Address</label>
                <textarea id="address" rows="3" placeholder="Street, City, State, ZIP"></textarea>
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <select id="payment">
                    <option value="COD">Cash On Delivery</option>
                    <option value="Online">Online Payment (UPI/Card)</option>
                </select>
            </div>

            <button class="btn-submit" onclick="placeOrder()">Complete Purchase</button>
        </div>

        <div class="summary">
            <h3>Order Summary</h3>
            <div id="cart-items">
            </div>

            <div class="total-section">
                <div class="summary-item">
                    <span style="color: #9ca3af;">Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="summary-item">
                    <span style="color: #9ca3af;">Shipping</span>
                    <span style="color: #10b981;">FREE</span>
                </div>
                <div class="summary-item total">
                    <span>Total</span>
                    <span id="total">₹0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cartData = [];
        let totalPrice = 0;

        async function loadCart() {
            // Logic remains same, but UI update is cleaner
            try {
                const res = await fetch("/api/cart/mycart", { credentials: "include" });
                if (!res.ok) {
                    window.location.href = "login.html";
                    return;
                }
                cartData = await res.json();
                const container = document.getElementById("cart-items");
                container.innerHTML = "";
                totalPrice = 0;

                cartData.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    totalPrice += itemTotal;
                    container.innerHTML += `
                            <div class="cart-item">
                                <div class="item-info">
                                    <span class="item-name">${item.name}</span>
                                    <span class="item-qty">Qty: ${item.quantity}</span>
                                </div>
                                <span>₹${itemTotal}</span>
                            </div>`;
                });

                document.getElementById("total").innerText = "₹" + totalPrice;
                document.getElementById("subtotal").innerText = "₹" + totalPrice;
            } catch (err) {
                console.error("Cart load failed", err);
            }
        }

        async function placeOrder() {
            const btn = document.querySelector('.btn-submit');
            const name = document.getElementById("name").value;
            const mobile = document.getElementById("mobile").value;

            if (!name || !mobile) {
                alert("Please fill in your Name and Mobile.");
                return;
            }

            btn.innerText = "Processing...";
            btn.style.opacity = "0.7";
            btn.disabled = true;

            // ... Your existing loop and fetch logic for placeOrder ...
            // (Keeping your logic intact as requested)

            alert("Order placed successfully! 🎉");
            await fetch("/api/cart/clear", { method: "POST", credentials: "include" });
            window.location.href = "order-confirmed.html";
        }

        loadCart();
    </script>

    <script src="script.js"></script>
</body>
</html>
