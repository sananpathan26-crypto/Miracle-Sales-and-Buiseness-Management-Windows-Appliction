
<!DOCTYPE html>
<html>
<head>
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css?v=2">
    <!--integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4+3r9V0T1p6pFZ7F7kC3s5jKw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer" />-->


    <style>
        body {
            background: #f4f6fb;
        }

        .order-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            padding: 20px;
            transition: 0.3s;
        }

            .order-card:hover {
                transform: translateY(-4px);
            }

        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

            .status.Pending {
                background: #fff3cd;
                color: #856404;
            }

            .status.Confirmed {
                background: #cce5ff;
                color: #004085;
            }

            .status.Delivered {
                background: #d4edda;
                color: #155724;
            }

            .status.Cancelled {
                background: #f8d7da;
                color: #721c24;
            }

        .order-title {
            font-weight: 600;
            font-size: 18px;
        }

        .price {
            font-weight: 700;
            color: #1e1e5a;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-logo">
            <span class="mir">MIR</span><span class="a">A</span><span class="cle">CLE</span>
        </div>

        <ul class="nav-links">
            <a href="index.html">Home</a>
            <li><a href="#categories">Shop Now</a></li>
            <li><a href="services.html">Our Services</a></li>
            <li><a href="aboutus.html">About Us</a></li>
        </ul>

        <div class="nav-icons">
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search cameras...">
                <i class="fas fa-search" id="search-icon"></i>
            </div>

            <div class="cart-icon" onclick="openCart()">
                <i class="fas fa-shopping-cart" title="Cart"></i>
                <span id="cart-count">0</span>
            </div>


            <!--
                <i class="fas fa-user" title="Profile"></i> -->
            <!--
            just for profile -->

            <div class="profile-wrapper">
                <i class="fas fa-user" id="profile-btn" title="Profile"></i>

                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="profile-header">
                        <i class="fas fa-user-circle"></i>
                        <div>
                            <h4>Guest User</h4>
                            <p>guest@email.com</p>
                        </div>
                    </div>

                    <ul class="profile-menu">
                        <li><a href="profile.html">My Account</a></li>
                        <li><a href="MyOrders.html">Orders</a></li>
                        <li><a href="#">Settings</a></li>
                        <li class="logout"><a href="#">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <a href="index.html" class="back-btn">←</a>


    <div class="container mt-4">
        <h3 class="mb-4">🛒 My Orders</h3>

        <!-- Orders will be injected here -->
        <div id="ordersContainer"></div>
    </div>
    <script>
        fetch('/api/userorders/my-orders', {
            credentials: 'include'   // 🔥 THIS LINE
        })
            .then(res => {
                if (!res.ok) throw new Error('Not logged in');
                return res.json();
            })
            .then(orders => {
                const container = document.getElementById('ordersContainer');
                container.innerHTML = '';

                if (orders.length === 0) {
                    container.innerHTML = '<p>No orders found</p>';
                    return;
                }

                orders.forEach(order => {
                    container.innerHTML += `
                <div class="order-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="order-title">${order.productName}</div>
                        <span class="status ${order.orderStatus}">
                            ${order.orderStatus}
                        </span>
                    </div>

                    <hr>

                    <div class="row">
                        <div class="col-md-4">
                            <p><strong>Order ID:</strong> #${order.orderID}</p>
                            <p><strong>Quantity:</strong> ${order.quantity}</p>
                        </div>

                        <div class="col-md-4">
                            <p><strong>Order Date:</strong>
                                ${new Date(order.orderDate).toLocaleDateString()}
                            </p>
                            <p><strong>Payment:</strong> ${order.paymentMode}</p>
                        </div>

                        <div class="col-md-4 text-end">
                            <p>
                            <strong>₹ ${order.price}</strong> × ${order.quantity}
                            = <strong class="price">₹ ${order.totalAmount}</strong>
                            </p>

                        </div>
                    </div>
                </div>`;
                });

            })
            .catch(err => {
                console.error(err);
                document.getElementById('ordersContainer').innerHTML =
                    '<p>Please login to view your orders.</p>';
            });


        function openCart() {
            window.location.href = "cart.html";
        }
    </script>

    <script src="script.js"></script>

</body>
</html>
