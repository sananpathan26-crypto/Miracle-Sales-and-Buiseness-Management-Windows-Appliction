    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
/*        body {
            font-family: Arial, sans-serif;

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
        }

        .order-wrapper {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .order-container {
            background: white;
            width: 420px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .product-box {
            background: #eef2ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

            .product-box img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 8px;
            }

        .price {
            font-weight: bold;
            font-size: 18px;
            margin-top: 5px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

            .qty-control button {
                width: 30px;
                height: 30px;
                border: none;
                background: #4f46e5;
                color: white;
                border-radius: 5px;
                cursor: pointer;
            }

        .total {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #4f46e5;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .submit-btn {
            margin-top: 20px;
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

            .submit-btn:hover {
                background: #15803d;
            }
    </style>
</head>

<body>

        <div class="nav-logo">

        </div>

            <li><a href="#categories">Shop Now</a></li>
            <li><a href="services.html">Our Services</a></li>
            <li><a href="aboutus.html">About Us</a></li>
        </ul>

        <div class="nav-icons">
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search cameras...">
                <i class="fas fa-search" id="search-icon"></i>
            </div>

            <!--<div class="cart-icon">
                <i class="fas fa-shopping-cart" title="Cart"></i>
                <span id="cart-count">0</span>
            </div>-->
            <!--<a href="cart.html" class="cart-icon">
                <i class="fas fa-shopping-cart" title="Cart"></i>
                <span id="cart-count">0</span>
            </a>-->

            <div class="cart-icon" onclick="openCart()">
                <i class="fas fa-shopping-cart" title="Cart"></i>
                <span id="cart-count">0</span>
            </div>





            <!--
            <i class="fas fa-user" title="Profile"></i> -->
            <!--
            just for profile -->

            <div class="profile-wrapper">
                <i class="fas fa-user" id="profile-btn" title="Profile"></i>

                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="profile-header">
                        <i class="fas fa-user-circle"></i>

                            <h4>Guest User</h4>

                    <ul class="profile-menu">
                        <li><a href="profile.html">My Account</a></li>

                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <a href="index.html" class="back-btn">←</a>

    <div class="order-wrapper">
        <div class="order-container">

            <h2>Complete Order</h2>

            <div class="product-box">
                <img id="productImage" src="" />
                <h3 id="productName">Loading...</h3>
                <div class="price" id="productPrice">₹0</div>

                <div class="qty-control">
                    <button onclick="changeQty(-1)">-</button>
                    <span id="quantity">1</span>
                    <button onclick="changeQty(1)">+</button>
                </div>

                <div class="total">
                    Total: ₹<span id="totalPrice">0</span>
                </div>
            </div>

            <form id="orderForm">

                <input type="text" placeholder="Full Name" required>
                <input type="text" placeholder="Mobile Number" required>
                <input type="email" placeholder="Email Address" required>

                <select required>
                    <option value="">Select Payment Method</option>
                    <option>UPI</option>
                    <option>Credit Card</option>
                    <option>Cash on Delivery</option>
                </select>

                <button type="submit" class="submit-btn">Place Order</button>

            </form>

        </div>
    </div>

    <script>

        let productPrice = 0;
        let quantity = 1;

        // Get id from URL
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (id) {
            fetch(`/api/products/${id}`)
                .then(res => res.json())
                .then(product => {

                    document.getElementById("productName").innerText = product.productName;
                    document.getElementById("productPrice").innerText = "₹" + product.price;
                    document.getElementById("productImage").src = product.imagePath;

                    productPrice = product.price;
                    updateTotal();

                })
                .catch(err => console.error(err));
        }

        // Quantity Change
        function changeQty(change) {
            quantity += change;
            if (quantity < 1) quantity = 1;

            document.getElementById("quantity").innerText = quantity;
            updateTotal();
        }

        // Update Total
        function updateTotal() {
            document.getElementById("totalPrice").innerText = productPrice * quantity;
        }

        // Handle Form Submit
        document.getElementById("orderForm").addEventListener("submit", function (e) {
            e.preventDefault();

            alert("Order Placed Successfully!");

            // Later we can connect this to Orders API
        });


        function openCart() {
            window.location.href = "cart.html";
        }

    </script>
