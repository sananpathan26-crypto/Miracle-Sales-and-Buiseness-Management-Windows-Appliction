<!DOCTYPE html>
<html>
<head>
    <title>All Products</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .product-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin: 15px;
            width: 260px;
            display: inline-block;
            vertical-align: top;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

            .product-card img {
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 8px;
            }

            .product-card h3 {
                margin: 10px 0;
            }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #e63946;
        }

        .product-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .add-cart-btn, .buy-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-cart-btn {
            background-color: #007bff;
            color: white;
        }

        .buy-btn {
            background-color: #28a745;
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-logo">
            <span class="mir">MIR</span><span class="a">A</span><span class="cle">CLE</span>
        </div>

        <ul class="nav-links">
            <a href="index.html">Home</a>
            <li><a href="#categories">Shop Now</a></li>
            <li><a href="services.html">Our Services</a></li>
            <li><a href="#">About Us</a></li>
        </ul>

        <div class="nav-icons">
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search cameras...">
                <i class="fas fa-search" id="search-icon"></i>
            </div>

            <!--<div class="cart-icon">
                <i class="fas fa-shopping-cart" title="Cart"></i>
                <span id="cart-count">0</span>
            </div>-->
            <!--<a href="cart.html" class="cart-icon">
                <i class="fas fa-shopping-cart" title="Cart"></i>
                <span id="cart-count">0</span>
            </a>-->

            <div class="cart-icon" onclick="openCart()">
                <i class="fas fa-shopping-cart" title="Cart"></i>
                <span id="cart-count">0</span>
            </div>





            <!--
            <i class="fas fa-user" title="Profile"></i> -->
            <!--
            just for profile -->

            <div class="profile-wrapper">
                <i class="fas fa-user" id="profile-btn" title="Profile"></i>

                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="profile-header">
                        <i class="fas fa-user-circle"></i>
                        <div>
                            <h4>Guest User</h4>
                            <p>guest@email.com</p>
                        </div>
                    </div>

                    <ul class="profile-menu">
                        <li><a href="profile.html">My Account</a></li>
                        <li><a href="MyOrders.html">Orders</a></li>
                        <li><a href="#">Settings</a></li>
                        <li class="logout"><a href="#">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>


    <h1>All Products</h1>
    <div id="products"></div>

    <script>
        async function loadProducts() {
            const res = await fetch("/api/products");
            const data = await res.json();

            const container = document.getElementById("products");
            container.innerHTML = "";

            data.forEach(p => {
                container.innerHTML += `
                                <div class="product-card">
                                    <img src="${p.imagePath}" />
                                    <h3>${p.productName}</h3>
                                    <p>${p.description.substring(0, 60)}...</p>
                                    <div class="price">₹${p.price}</div>

                                    <div class="product-actions">
                                       <button class="add-cart-btn"
                                       onclick="addToCart('${p.productId}', '${p.productName}', ${p.price}, '${p.imagePath}')">
                                       Add to Cart
                                      </button>

                                      <button class="buy-btn"
                                     onclick="buyNow(${p.productId})">
                                     Buy Now
                                     </button>


                                    </div>
                                </div>
                            `;
            });
        }

        loadProducts();


    

       
        function addToCart(id, name, price, imageUrl) {

            fetch("http://localhost:5271/api/cart/add", {
                method: "POST",
                credentials: "include", // 🔥 MUST BE HERE
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    productId: id,
                    productName: name,
                    price: price,
                    imageUrl: imageUrl
                })
            })
                .then(response => {
                    if (response.status === 401) {
                        alert("Please login again");
                        return;
                    }
                    return response.json();
                })
                .then(data => {
                    if (data) {
                        alert("Added to cart successfully");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                });
        }




        function openCart() {
            window.location.href = "cart.html";
        }

        function buyNow(id) {
            window.location.href = `customer1.html?id=${id}`;
        }


    </script>

    <script src="product1.js" defer></script>
    <script src="script.js"></script>

</body>
</html>
